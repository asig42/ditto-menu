<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#030303">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%23030303'/%3E%3Ctext x='50%25' y='54%25' dominant-baseline='middle' text-anchor='middle' font-family='sans-serif' font-weight='900' font-size='36' fill='%23ff781f'%3ED%3C/text%3E%3C/svg%3E">
<title>DITTO · 메뉴 운영</title>
<link rel="stylesheet" href="../base.css">
<link rel="stylesheet" href="admin.css">
</head>
<body>
<section class="wrap login" id="login" hidden>
  <h1>DITTO 메뉴 운영</h1>
  <p id="login-status" role="status">로그인을 확인하고 있습니다.</p>
  <button id="google-login" class="primary" disabled>Google로 로그인</button>
  <button id="logout" hidden>로그아웃</button>
</section>
<main class="wrap" id="admin" hidden>
  <header class="admin-top">
    <div class="admin-brand"><img src="../ditto-logo.png" width="66" height="44" alt="DITTO"><h1>메뉴 운영</h1></div>
    <a class="button guest-link" href="../" target="_blank" rel="noopener">손님 화면 보기 ↗</a>
  </header>
  <p class="muted preview-note">운영 시안입니다. 변경사항은 이 브라우저에만 저장됩니다.</p>
  <nav class="nav" id="admin-nav" aria-label="관리할 카테고리"></nav>
  <div class="admin-grid">
    <section aria-label="등록된 메뉴">
      <header class="list-head">
        <div><h2 id="list-title">푸드</h2><p id="count" class="muted"></p></div>
        <div class="list-actions">
          <button id="reorder-cancel" type="button" hidden>취소</button>
          <button id="reorder" type="button" aria-pressed="false">순서 변경</button>
          <button id="add" type="button">메뉴 추가</button>
        </div>
      </header>
      <p id="reorder-help" class="muted" hidden>손잡이를 끌거나 위·아래 화살표를 눌러 순서를 바꾼 뒤 ‘순서 변경 완료’를 눌러 저장하세요.</p>
      <div class="feedback"><p id="status" role="status"></p><button id="undo" type="button" hidden>되돌리기</button></div>
      <div id="admin-list"></div>
    </section>
    <div class="edit-panel">
      <p id="empty-editor">목록에서 메뉴를 선택하면 편집할 수 있습니다.</p>
      <form class="form" id="editor" hidden>
        <header class="editor-head">
          <div><h2 id="editor-title">메뉴 편집</h2><p id="editor-state" class="muted"></p></div>
          <button type="button" id="close-editor">닫기</button>
        </header>
        <div class="form-fields">
          <label>메뉴명<input name="name" required maxlength="90"></label>
          <label>영문명<input name="english" maxlength="90"></label>
          <div class="field-row">
            <label>카테고리<select name="category"></select></label>
            <label id="group-field">푸드 구분<select name="group"></select></label>
          </div>
          <label>가격 표시<input name="price" maxlength="40" placeholder="19,000원"></label>
          <label>재료 또는 설명<textarea name="detail" rows="3" maxlength="350"></textarea></label>
          <label>영문 설명 (선택)<textarea name="englishDetail" rows="3" maxlength="350"></textarea></label>
          <div class="preview" id="preview" hidden></div>
          <div class="danger-actions" id="danger-actions" hidden>
            <button type="button" id="discard-draft" hidden>미공개 수정 취소</button>
            <button type="button" id="delete-item" class="danger">메뉴 삭제</button>
          </div>
        </div>
        <div class="actions">
          <button type="button" id="preview-button">미리 보기</button>
          <button type="submit" value="draft">초안 저장</button>
          <button type="submit" class="primary" value="public">공개하기</button>
        </div>
      </form>
    </div>
  </div>
</main>
<script src="../runtime.js"></script>
<script src="../menu-data.js"></script>
<script src="admin.js"></script>
</body>
</html>
