<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#030303">
<title>DITTO 부산 · 메뉴</title>
<link rel="stylesheet" href="base.css">
<style>.landing,.intro,#menu{scroll-snap-align:start}
.landing{min-height:100svh;display:grid;place-items:center;position:relative;background:#000}
.logo{width:clamp(184px,43vw,340px);height:auto}
.arrow{position:absolute;bottom:max(26px,env(safe-area-inset-bottom));display:grid;place-items:center;width:48px;height:48px}
.intro{min-height:100svh;display:grid;align-content:center;justify-items:center;text-align:center;padding:clamp(68px,10vh,120px) 24px;gap:clamp(19px,4vh,38px)}
.intro p{margin:0;line-height:1.65;font-size:clamp(15px,2.5vw,25px);font-weight:650;letter-spacing:-.035em}
.intro .lead{color:var(--orange);font-size:clamp(21px,3.6vw,38px);font-weight:850;line-height:1.42}
.intro .waiting{opacity:0;transform:translateY(6px)}
.intro p{transition:opacity .75s ease,transform .75s ease}
.next{font-size:.85rem;text-decoration:underline;text-underline-offset:.4em;display:grid;place-items:center;min-height:44px}
.menu-head{padding:clamp(44px,8vw,86px) 0 20px;border-top:1px solid var(--line)}
h1,h2,h3,p{margin:0}
h1,h2{font-weight:900;letter-spacing:-.075em;line-height:1}
.menu-head h1{font-size:clamp(72px,15vw,160px)}
.category{padding:54px 0 16px;scroll-margin-top:56px}
.category h2{font-size:clamp(42px,8vw,77px);margin-bottom:19px}
.note{font-size:.94rem;line-height:1.75;color:var(--muted);max-width:48ch;margin-bottom:17px}
.entries{display:grid;column-gap:42px}
footer{border-top:1px solid var(--line);margin-top:64px;padding:24px 0 46px;color:var(--muted);font-size:.84rem;display:flex;justify-content:space-between;gap:10px}
@media(min-width:700px){.entries{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.intro p{transition:none}.intro .waiting{opacity:1;transform:none}}
</style>
<main id="guest">
  <section class="landing" aria-label="DITTO">
    <img class="logo" src="ditto-logo.png" width="511" height="337" alt="DITTO">
    <a class="arrow" href="#intro" aria-label="디토 소개 보기"><svg width="17" height="26" viewBox="0 0 17 26" fill="none" aria-hidden="true"><path d="M8.5 2v20m-6-6 6 6 6-6" stroke="currentColor" stroke-width="1.25"/></svg></a>
  </section>
  <section id="intro" class="intro" aria-label="디토 소개">
    <p class="lead">디토는 부산의 페어링 전문 와인바입니다<br>요리는 발효와 숙성을 주제로 합니다</p>
    <p>미슐랭2스타 헤드소믈리에 출신<br>15년 경력의 “김형준 소믈리에”가<br>전반적인 페어링을 책임 지고 있으며</p>
    <p>“윤수영 셰프”가 이에 어울리는<br>요리를 준비 하고 있습니다</p>
    <p>손님과의 소통을 바탕으로<br>가장 완벽한 한 잔과 한 접시를<br>제안드립니다</p>
    <p>방문해 주셔서 감사합니다</p>
    <a href="#menu" class="next">메뉴 보기</a>
  </section>
  <section id="menu" aria-labelledby="menu-title">
    <div class="wrap menu-head"><h1 id="menu-title">Menu</h1></div>
    <div class="nav-shell"><nav id="menu-nav" class="nav wrap" aria-label="메뉴 카테고리"></nav></div>
    <div class="wrap" id="menu-list"></div>
    <footer class="wrap"><span>@Ditto_Busan</span></footer>
  </section>
</main>
<script src="menu-data.js"></script>
<script src="menu.js"></script>
</html>
