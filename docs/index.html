<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#030303">
<meta name="description" content="디토는 부산의 발효와 숙성 요리를 선보이는 페어링 전문 와인바입니다. 오늘의 푸드, 와인, 하이볼, 칵테일 메뉴를 확인하세요.">
<meta property="og:type" content="website">
<meta property="og:title" content="DITTO 부산 · 메뉴">
<meta property="og:description" content="부산 페어링 전문 와인바 디토의 발효·숙성 요리와 와인 페어링 메뉴">
<meta property="og:locale" content="ko_KR">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%23030303'/%3E%3Ctext x='50%25' y='54%25' dominant-baseline='middle' text-anchor='middle' font-family='sans-serif' font-weight='900' font-size='36' fill='%23ff781f'%3ED%3C/text%3E%3C/svg%3E">
<title>DITTO 부산 · 메뉴</title>
<link rel="stylesheet" href="base.css">
<style>
h1,h2,h3,p{margin:0}
.splash{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:#000;cursor:pointer;opacity:1;transition:opacity .45s ease}
.splash.is-leaving{opacity:0;pointer-events:none}
.splash .logo{width:clamp(184px,42vw,320px);height:auto}
.menu-head{padding:clamp(24px,4.5vh,52px) 0 clamp(18px,3vh,28px);display:grid;gap:clamp(10px,1.8vh,16px)}
.menu-head-top{display:flex;align-items:center;justify-content:space-between;gap:16px}
.menu-head h1{font-size:clamp(48px,9.5vw,92px);line-height:1}
.brand-mark{width:clamp(62px,11vw,86px);height:auto;flex-shrink:0}
.brand-lead{color:var(--orange);font-size:clamp(14px,1.9vw,17px);font-weight:650;line-height:1.5;max-width:46ch}
.story-trigger{justify-self:start;display:inline-flex;align-items:center;gap:6px;padding:0;min-height:44px;border:0;background:none;color:var(--muted);font-size:.86rem;font-weight:600;text-decoration:underline;text-underline-offset:.36em;text-decoration-color:var(--line);transition:color .2s ease,text-decoration-color .2s ease}
.story-trigger:hover{color:var(--orange);text-decoration-color:var(--orange)}
.category{padding:clamp(38px,5.5vh,56px) 0 14px;scroll-margin-top:64px}
.category:first-child{padding-top:clamp(28px,4vh,42px)}
.category h2{font-size:clamp(32px,6.2vw,60px);margin-bottom:18px}
.note{font-size:.94rem;line-height:1.75;color:var(--muted);max-width:48ch;margin-bottom:22px}
.category--bottle .note,.category--glass .note{border-left:2px solid var(--orange);padding-left:14px}
.category--bottle .item h3{font-family:Paperozi,Pretendard,system-ui,sans-serif;color:var(--orange);letter-spacing:-.02em}
.subgroup{margin-top:26px}
.subgroup:first-of-type{margin-top:8px}
.subgroup-title{font-size:.8rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--orange);margin:0 0 10px}
.entries{display:grid;column-gap:clamp(28px,4vw,46px)}
.loading-skeleton{display:grid;gap:14px;padding:12px 0 24px}
.skeleton-bar{height:18px;border-radius:3px;background:linear-gradient(90deg,#151412 25%,#22201d 50%,#151412 75%);background-size:200% 100%;animation:shimmer 1.4s ease-in-out infinite}
.skeleton-bar.short{width:42%}
.skeleton-bar.mid{width:68%}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
footer{border-top:1px solid var(--line);margin-top:56px;padding:24px 0 46px;color:var(--muted);font-size:.84rem;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px}
footer a{color:var(--ink);text-decoration:underline;text-underline-offset:.32em;text-decoration-color:var(--line);transition:color .2s ease,text-decoration-color .2s ease}
footer a:hover{color:var(--orange);text-decoration-color:var(--orange)}
.story-sheet{width:100%;height:100%;max-width:none;max-height:none;margin:0;padding:0;border:0;background:var(--bg);color:var(--ink);overflow-y:auto}
.story-sheet::backdrop{background:#000}
.story-bar{position:sticky;top:0;z-index:2;display:flex;justify-content:flex-end;padding:max(14px,env(safe-area-inset-top)) max(20px,calc((100% - 1020px) / 2)) 0;pointer-events:none}
.story-close{pointer-events:auto;background:var(--bg);border:1px solid var(--line);border-radius:3px;color:var(--ink);font-size:.84rem;font-weight:600;padding:0 14px;min-height:44px}
.story-close:hover{border-color:var(--orange);color:var(--orange)}
.story-body{min-height:calc(100svh - 64px);display:grid;align-content:center;justify-items:center;text-align:center;padding:clamp(24px,5vh,56px) 24px clamp(44px,7vh,76px);gap:clamp(18px,3.2vh,32px);max-width:680px;margin-inline:auto}
.story-logo{width:clamp(112px,24vw,168px);height:auto;margin-bottom:4px}
.story-body p{margin:0;line-height:1.68;font-size:clamp(15px,2.2vw,22px);font-weight:600;letter-spacing:-.02em}
.story-body .lead{color:var(--orange);font-family:Paperozi,Pretendard,system-ui,sans-serif;font-size:clamp(20px,3.2vw,34px);font-weight:800;line-height:1.42}
.story-back{margin-top:6px;font-size:.88rem;font-weight:650;padding:.65rem 1.2rem;border-color:var(--line)}
.story-back:hover{border-color:var(--orange);color:var(--orange)}
@media(min-width:700px){
  .entries{grid-template-columns:repeat(2,minmax(0,1fr))}
  .menu-head{padding:clamp(22px,3.6vh,40px) 0 clamp(16px,2.4vh,24px)}
}
@media(max-height:820px) and (min-width:700px){
  .story-body{gap:clamp(12px,2vh,20px);padding:8px 24px 28px}
  .story-logo{width:clamp(96px,14vw,132px);margin-bottom:0}
  .story-body .lead{font-size:clamp(19px,2.7vw,28px)}
  .story-body p{font-size:clamp(14px,1.9vw,19px);line-height:1.58}
}
@media(max-height:700px) and (min-width:700px){
  .menu-head h1{font-size:clamp(40px,6vw,64px)}
  .category h2{font-size:clamp(28px,4.5vw,44px)}
}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.splash{transition:none}.skeleton-bar{animation:none}}
</style>
</head>
<body>
<div id="splash" class="splash" role="presentation" aria-hidden="true" hidden>
  <img class="logo" src="ditto-logo.png" width="511" height="337" alt="">
</div>
<main id="guest">
  <section id="menu" aria-labelledby="menu-title">
    <header class="wrap menu-head">
      <div class="menu-head-top">
        <h1 id="menu-title">Menu</h1>
        <img class="logo brand-mark" src="ditto-logo.png" width="511" height="337" alt="DITTO">
      </div>
      <p id="brand-lead" class="brand-lead">디토는 부산의 발효와 숙성을 주제로 한 페어링 전문 와인바입니다.</p>
      <button type="button" id="open-story" class="story-trigger">소믈리에 · 셰프 소개 보기 →</button>
    </header>
    <div class="nav-shell">
      <div class="wrap nav-bar">
        <div class="nav-track" id="nav-track">
          <nav id="menu-nav" class="nav" aria-label="메뉴 카테고리"></nav>
        </div>
        <div class="lang-switch" role="group" aria-label="언어 선택">
          <button type="button" data-lang="ko" aria-pressed="true">KR</button>
          <button type="button" data-lang="en" aria-pressed="false">EN</button>
        </div>
      </div>
    </div>
    <div class="wrap" id="menu-list"></div>
    <footer class="wrap">
      <a href="https://www.instagram.com/ditto_busan/" target="_blank" rel="noopener noreferrer">@Ditto_Busan</a>
      <span id="footer-tagline">부산 페어링 전문 와인바</span>
    </footer>
  </section>
</main>
<dialog id="story-sheet" class="story-sheet" aria-label="디토 소개">
  <div class="story-bar">
    <button type="button" id="close-story" class="story-close">닫기 ✕</button>
  </div>
  <div class="story-body" id="story-body">
    <img class="logo story-logo" src="ditto-logo.png" width="511" height="337" alt="DITTO">
    <p class="lead">디토는 부산의 페어링 전문 와인바입니다<br>요리는 발효와 숙성을 주제로 합니다</p>
    <p>미슐랭2스타 헤드소믈리에 출신<br>15년 경력의 “김형준 소믈리에”가<br>전반적인 페어링을 책임지고 있으며</p>
    <p>“윤수영 셰프”가 이에 어울리는<br>요리를 준비하고 있습니다</p>
    <p>손님과의 소통을 바탕으로<br>가장 완벽한 한 잔과 한 접시를<br>제안드립니다</p>
    <p>방문해 주셔서 감사합니다</p>
    <button type="button" id="story-back" class="story-back">메뉴로 돌아가기</button>
  </div>
</dialog>
<p id="menu-error" class="wrap note" role="status"></p>
<script src="runtime.js"></script>
<script src="menu-data.js"></script>
<script src="menu.js"></script>
</body>
</html>
