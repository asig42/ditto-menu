<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#030303">
<meta name="description" content="디토는 부산의 발효와 숙성 요리를 선보이는 페어링 전문 와인바입니다. 오늘의 푸드, 와인, 하이볼, 칵테일 메뉴를 확인하세요.">
<meta property="og:type" content="website">
<meta property="og:title" content="DITTO 부산 · 메뉴">
<meta property="og:description" content="부산 페어링 전문 와인바 디토의 발효·숙성 요리와 와인 페어링 메뉴">
<meta property="og:locale" content="ko_KR">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%23030303'/%3E%3Ctext x='50%25' y='54%25' dominant-baseline='middle' text-anchor='middle' font-family='sans-serif' font-weight='900' font-size='36' fill='%23ff781f'%3ED%3C/text%3E%3C/svg%3E">
<title>DITTO 부산 · 메뉴</title>
<link rel="stylesheet" href="base.css">
<style>.landing,.intro,#menu{scroll-snap-align:start}
.landing{min-height:100svh;display:grid;place-items:center;position:relative;background:#000}
.landing-lang{position:absolute;top:max(18px,env(safe-area-inset-top));right:max(22px,calc((100% - 1020px) / 2))}
.logo{width:clamp(184px,43vw,340px);height:auto}
.landing-actions{position:absolute;bottom:max(22px,env(safe-area-inset-bottom));display:grid;justify-items:center;gap:6px}
.arrow{display:grid;place-items:center;width:48px;height:44px;color:var(--ink)}
.skip-menu{font-size:.82rem;color:var(--muted);letter-spacing:.01em;min-height:36px;display:inline-flex;align-items:center;padding:0 12px;border-bottom:1px solid transparent;transition:color .2s ease}
.skip-menu:hover{color:var(--orange)}
.intro{min-height:100svh;display:grid;align-content:center;justify-items:center;text-align:center;padding:clamp(68px,10vh,120px) 24px;gap:clamp(19px,4vh,38px)}
.intro p{margin:0;line-height:1.65;font-size:clamp(16px,2.5vw,25px);font-weight:600;letter-spacing:-.02em}
.intro .lead{color:var(--orange);font-family:Paperozi,Pretendard,system-ui,sans-serif;font-size:clamp(21px,3.6vw,38px);font-weight:800;line-height:1.42}
.intro .waiting{opacity:0;transform:translateY(6px)}
.intro p{transition:opacity .75s ease,transform .75s ease}
.next{font-size:.88rem;font-weight:600;text-decoration:underline;text-underline-offset:.4em;display:grid;place-items:center;min-height:44px;color:var(--ink)}
.next:hover{color:var(--orange)}
.menu-head{padding:clamp(44px,8vw,86px) 0 20px;border-top:1px solid var(--line)}
h1,h2,h3,p{margin:0}
.menu-head h1{font-size:clamp(60px,12vw,128px)}
.category{padding:54px 0 16px;scroll-margin-top:60px}
.category h2{font-size:clamp(34px,7vw,68px);margin-bottom:20px}
.note{font-size:.94rem;line-height:1.75;color:var(--muted);max-width:48ch;margin-bottom:22px}
.category--bottle .note,.category--glass .note{border-left:2px solid var(--orange);padding-left:14px}
.category--bottle .item h3{font-family:Paperozi,Pretendard,system-ui,sans-serif;color:var(--orange);letter-spacing:-.02em}
.subgroup{margin-top:26px}
.subgroup:first-of-type{margin-top:8px}
.subgroup-title{font-size:.8rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--orange);margin:0 0 10px}
.entries{display:grid;column-gap:42px}
.loading-skeleton{display:grid;gap:14px;padding:12px 0 24px}
.skeleton-bar{height:18px;border-radius:3px;background:linear-gradient(90deg,#151412 25%,#22201d 50%,#151412 75%);background-size:200% 100%;animation:shimmer 1.4s ease-in-out infinite}
.skeleton-bar.short{width:42%}
.skeleton-bar.mid{width:68%}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
footer{border-top:1px solid var(--line);margin-top:64px;padding:24px 0 46px;color:var(--muted);font-size:.84rem;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px}
footer a{color:var(--ink);text-decoration:underline;text-underline-offset:.32em;text-decoration-color:var(--line);transition:color .2s ease,text-decoration-color .2s ease}
footer a:hover{color:var(--orange);text-decoration-color:var(--orange)}
@media(min-width:700px){.entries{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.intro p{transition:none}.intro .waiting{opacity:1;transform:none}.skeleton-bar{animation:none}}
</style>
</head>
<body>
<main id="guest">
  <section class="landing" aria-label="DITTO">
    <div class="lang-switch landing-lang" role="group" aria-label="언어 선택">
      <button type="button" data-lang="ko" aria-pressed="true">KR</button>
      <button type="button" data-lang="en" aria-pressed="false">EN</button>
    </div>
    <img class="logo" src="ditto-logo.png" width="511" height="337" alt="DITTO">
    <div class="landing-actions">
      <a class="arrow" href="#intro" aria-label="디토 소개 보기"><svg width="17" height="26" viewBox="0 0 17 26" fill="none" aria-hidden="true"><path d="M8.5 2v20m-6-6 6 6 6-6" stroke="currentColor" stroke-width="1.25"/></svg></a>
      <a class="skip-menu" href="#menu">메뉴 바로가기</a>
    </div>
  </section>
  <section id="intro" class="intro" aria-label="디토 소개">
    <p class="lead">디토는 부산의 페어링 전문 와인바입니다<br>요리는 발효와 숙성을 주제로 합니다</p>
    <p>미슐랭2스타 헤드소믈리에 출신<br>15년 경력의 “김형준 소믈리에”가<br>전반적인 페어링을 책임지고 있으며</p>
    <p>“윤수영 셰프”가 이에 어울리는<br>요리를 준비하고 있습니다</p>
    <p>손님과의 소통을 바탕으로<br>가장 완벽한 한 잔과 한 접시를<br>제안드립니다</p>
    <p>방문해 주셔서 감사합니다</p>
    <a href="#menu" class="next">메뉴 보기</a>
  </section>
  <section id="menu" aria-labelledby="menu-title">
    <div class="wrap menu-head"><h1 id="menu-title">Menu</h1></div>
    <div class="nav-shell">
      <div class="wrap nav-bar">
        <div class="nav-track" id="nav-track">
          <nav id="menu-nav" class="nav" aria-label="메뉴 카테고리"></nav>
        </div>
        <div class="lang-switch" role="group" aria-label="언어 선택">
          <button type="button" data-lang="ko" aria-pressed="true">KR</button>
          <button type="button" data-lang="en" aria-pressed="false">EN</button>
        </div>
      </div>
    </div>
    <div class="wrap" id="menu-list"></div>
    <footer class="wrap">
      <a href="https://www.instagram.com/ditto_busan/" target="_blank" rel="noopener noreferrer">@Ditto_Busan</a>
      <span id="footer-tagline">부산 페어링 전문 와인바</span>
    </footer>
  </section>
</main>
<p id="menu-error" class="wrap note" role="status"></p>
<script src="runtime.js"></script>
<script src="menu-data.js"></script>
<script src="menu.js"></script>
</body>
</html>
